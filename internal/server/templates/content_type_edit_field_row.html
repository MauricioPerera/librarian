{{define "content_type_edit_field_row"}}<div class="field-row">
  <input type="hidden" name="field_id" value="{{.ID}}">
  <input type="text" name="field_name" value="{{.Name}}" placeholder="nombre_del_campo" class="field-row-name">
  <select name="field_type" class="field-row-type"{{if .ID}} disabled{{end}}>
    {{range .Types}}<option value="{{.Value}}"{{if .Selected}} selected{{end}}>{{.Value}}</option>{{end}}
  </select>
  {{if .ID}}<input type="hidden" name="field_type" value="{{.TypeValue}}"><span class="muted">tipo fijo</span>{{end}}
</div>{{end}}
