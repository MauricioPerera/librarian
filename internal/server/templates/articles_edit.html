{{define "content"}}
<div class="card form-card">
  <h1>Editar artículo</h1>
  {{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
  <form class="form" hx-put="/admin/articles/{{.Article.ID}}">
    <label>Título
      <input type="text" name="title" value="{{.Article.Title}}" required autofocus>
    </label>
    <label>Cuerpo
      <textarea name="body" rows="10" required>{{.Article.Body}}</textarea>
    </label>
    {{if .CanManageTerms}}
    <fieldset class="terms-fieldset">
      <legend>Categorías y tags</legend>
      {{range .TermGroups}}
      <div class="term-group">
        <p class="term-group-taxonomy">{{.Taxonomy}}</p>
        {{range .Terms}}
        <label class="checkbox"><input type="checkbox" name="terms" value="{{.ID}}"{{if .Checked}} checked{{end}}> {{.Name}}</label>
        {{end}}
      </div>
      {{end}}
      {{if not .TermGroups}}<p class="muted">No hay categorías ni tags. <a href="/admin/terms/new">Creá alguna</a>.</p>{{end}}
    </fieldset>
    {{end}}
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Guardar</button>
      <a class="btn btn-ghost" href="/admin/articles">Cancelar</a>
    </div>
  </form>
</div>
{{end}}
