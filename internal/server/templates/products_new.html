{{define "content"}}
<div class="card form-card">
  <h1>Nuevo producto</h1>
  {{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
  <form method="post" action="/admin/products" class="form">
    <label>Título
      <input type="text" name="title" value="{{.Product.Title}}" required autofocus>
    </label>
    <label>Descripción
      <textarea name="body" rows="8" required>{{.Product.Body}}</textarea>
    </label>
    <label>Precio
      <input type="text" name="price" value="{{.Product.Price}}" inputmode="decimal" required>
    </label>
    <label>SKU
      <input type="text" name="sku" value="{{.Product.SKU}}" required>
    </label>
    {{if .CanManageTerms}}
    <fieldset class="terms-fieldset">
      <legend>Categorías y tags</legend>
      {{range .TermGroups}}
      <div class="term-group">
        <p class="term-group-taxonomy">{{.Taxonomy}}</p>
        {{range .Terms}}
        <label class="checkbox"><input type="checkbox" name="terms" value="{{.ID}}"{{if .Checked}} checked{{end}}> {{.Name}}</label>
        {{end}}
      </div>
      {{end}}
      {{if not .TermGroups}}<p class="muted">No hay categorías ni tags. <a href="/admin/terms/new">Creá alguna</a>.</p>{{end}}
    </fieldset>
    {{end}}
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Crear</button>
      <a class="btn btn-ghost" href="/admin/products">Cancelar</a>
    </div>
  </form>
</div>
{{end}}
